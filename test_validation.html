<!DOCTYPE html>
<html>
<head>
    <title>Testing Digital Guardians</title>
</head>
<body>
    <h1>Validation Tests</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        // Test 1: Check if HTML is valid
        fetch('index.html')
            .then(r => r.text())
            .then(html => {
                if (html.includes('<!DOCTYPE html>')) {
                    results.innerHTML += '<p>✅ HTML structure is valid</p>';
                }
                if (html.includes('styles.css')) {
                    results.innerHTML += '<p>✅ CSS file is linked</p>';
                }
                if (html.includes('script.js')) {
                    results.innerHTML += '<p>✅ JavaScript file is linked</p>';
                }
            });
        
        // Test 2: Check CSS file exists
        fetch('styles.css')
            .then(r => {
                if (r.ok) {
                    results.innerHTML += '<p>✅ CSS file exists and accessible</p>';
                }
            });
        
        // Test 3: Check JS file exists
        fetch('script.js')
            .then(r => {
                if (r.ok) {
                    results.innerHTML += '<p>✅ JavaScript file exists and accessible</p>';
                }
            });
        
        // Test 4: Check resource pages
        const pages = ['safety-checklist', 'privacy-guide', 'phishing-guide'];
        pages.forEach(page => {
            fetch(`resources/${page}.html`)
                .then(r => {
                    if (r.ok) {
                        results.innerHTML += `<p>✅ Resource page ${page}.html exists</p>`;
                    }
                });
        });
    </script>
</body>
</html>
